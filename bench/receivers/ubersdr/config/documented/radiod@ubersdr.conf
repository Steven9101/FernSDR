# radiod for UberSDR: the madpsy fork's config/radiod@ubersdr.conf at 77d0fba,
# which UberSDR's radiod container starts from, changed only for the lab's
# input and for running in UberSDR's own network namespace. Every change
# says what it replaced. UberSDR reads this same file (mounted at the same
# path in both containers) for the front end's sample rate, as a plain
# number, and derives its tuning range and spectrum span from it.

# ka9q-radio configuration for RX888 with dynamic channel support
# For use with UberSDR

[global]
# was: hardware = rx888
hardware = fifos16
description = RX888-HF
# Keep upstream stream names: dns=false maps these by FNV1 to the
# numeric groups in config.yaml, without requiring an mDNS daemon.
status = hf-status.local
data = pcm.local
ttl = 1
# added: all multicast on the loopback interface. UberSDR shares this
# network namespace instead of reaching radiod over a Docker bridge, and the
# lab's namespaces have no default route for a TTL 1 socket to follow.
iface = lo
mode = usb
samprate = 12000
blocktime = 20
overlap = 5
fft-threads = 1

# was: [rx888] device = rx888, samprate = 64800000, description = RX888-HF,
# calibrate = 0, and the RX888's commented gain and attenuator settings
[fifos16]
device = fifos16
library = /usr/local/lib/ka9q-radio/fifos16.so
description = "fernbench real samples"
path = /iq/in
samprate = 20480000
