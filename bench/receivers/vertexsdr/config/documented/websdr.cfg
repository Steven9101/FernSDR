# fernbench, tier "documented": websdr.cfg as shipped at a78a943, changed
# only where a line starting "# fernbench:" says so: the lab's input through
# the example's rtl_tcp band, 7.1 MHz, and no directory registration.
#
# VertexSDR Server Configuration
# https://github.com/Steven9101/VertexSDR - LGPL 3.0
#
# Lines starting with # are comments.
# Band configuration lines must be grouped together.
#

############################################################################
# Server settings

maxusers 100
idletimeout 14400
tcpport 8901
dotrustlocalnet
logfileinterval 0
# fernbench: offline. Without this VertexSDR registers with
# websdr.ewi.utwente.nl:80 even when no orgserver line is set
# (src/orgserver.c, src/main.c).
noorgserver
slowdownusers 20
slowdownusers2 30
fftplaneffort 1
fftbackend fftw
public pub2
waterfallformat 9
audioformat 3
# fernbench: the lab's band is centred on 7100 kHz (was 10100).
initial 7100 usb

############################################################################
# SDR List registration (websdr.org + sdr-list.xyz)
#
# Uncomment and fill in to appear on both the WebSDR directory and sdr-list.
# VertexSDR registers on both sites automatically from this single config.
# websdr.org registration and sdr-list updates stay paired.
# Each band gets registered as a separate receiver.
#
# orgserver websdr.org
# myhost your.public.ip.or.hostname
# hostname your.public.hostname.com
# org qth JO21OC
# org description My HF receiver
# org email your@email.com
#
# Make sure your port is reachable from the internet.

############################################################################
# Band: RTL-SDR via rtl_tcp
#
# Start rtl_tcp first:
#   rtl_tcp -a 127.0.0.1 -p 1234 -f 10100000 -s 2048000 -g 30

# fernbench: this example band is the lab's input, pace serving rtl_tcp on
# 127.0.0.1:1234 in the receiver's network namespace; centred on 7100 kHz
# (was 10100). The stdin band below is commented out in its place.
band HF
device !rtlsdr 127.0.0.1:1234
samplerate 2048000
centerfreq 7100
gain 30

############################################################################
# More band examples (uncomment and edit to use)

# ALSA soundcard:
# band Audio
# device hw:0,0
# samplerate 48000
# centerfreq 1000
# noniq
# gain 0

# stdin with rx_sdr (rx_tools):
# band HF-rx
# device !stdin
# stdinformat cu8
# samplerate 2048000
# centerfreq 10100
# gain 0

# stdin with signed 16-bit IQ:
# fernbench: the input is the rtl_tcp band above (was active).
#band IQ16
#device !stdin
#stdinformat cu8
#samplerate 2048000
#centerfreq 10100
#gain 0
