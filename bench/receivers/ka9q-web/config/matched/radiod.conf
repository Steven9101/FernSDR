# radiod for ka9q-web: ka9q-web's own example, config/radiod@rx888-web.conf
# at 4efea4b, changed only for the lab's input and for multicast inside one
# container without mDNS. Every change says what it replaced.

[global]
# was: hardware = rx888
hardware = fifos16
# was: status = web.local, a name avahi publishes over mDNS; the container
# runs no avahi, and ka9q-web takes a numeric group with -m.
status = 239.201.1.1
samprate = 12k
preset = usb
# was: data = web-pcm.local (see status)
data = 239.201.1.2
# added: all multicast on the loopback interface. The lab's network
# namespaces have no default route, so a TTL 1 socket without an interface
# would have nowhere to send.
iface = lo
# added: no avahi advertisements. radiod forks avahi-publish-service for
# them, and without avahi in the container the fork's child carries on as a
# second radiod (NOTES.md, upstream bugs).
advertise = no

# was: [rx888] device = "rx888", description = "rx888 generic"
[fifos16]
device = fifos16
library = /usr/local/lib/ka9q-radio/fifos16.so
description = "fernbench real 20.48 Msps"
samprate = 20480000
path = /iq/in
