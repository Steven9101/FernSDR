# fernbench, tier "matched": the documented tier (server/fernsdr.example.conf
# with the lab's input) with the lab's cap rule applied: 2000 listeners, no
# per-address limits. Every change is on a line starting "# fernbench:".

# FernSDR configuration.
#
# Frequencies accept suffixes: 7.1M, 14074k, 3690000 are all valid.
# Copy this to fernsdr.conf and edit.

# The station details below, name to notice and max_users, can also be set on
# the admin panel's Station page, which keeps them in fernsdr-settings.json
# beside this file. Whichever changed last wins: a value saved in the panel
# stands until that setting is edited here.
[site]
name     = Example WebSDR
operator = N0CALL
location = Somewhere, Earth
grid     = DN31
antenna  = 80 m horizontal loop at 12 m
contact  = n0call@example.org
website  = https://example.org/websdr
# Shown as a banner in the client.  Leave empty for none.
notice   =
# Where the source for THIS receiver lives.  FernSDR is AGPL: if you modify it
# and let other people listen, section 13 entitles them to your modified
# source, and this link is how they get it.  Point it at your own repository
# if you have changed anything; leave it alone if you have not.
source_url = https://github.com/steven9101/WebSDR
# Colours, background image and widgets live in a JSON file the admin panel
# writes, so changing them never rewrites this file or restarts the receiver.
# Defaults to fernsdr-theme.json beside this one; station details the panel can
# edit go to fernsdr-settings.json the same way.
# theme_file = fernsdr-theme.json
# Refused politely beyond this, with a "receiver is at capacity" message
# rather than a silent failure.
# fernbench: the cap rule, 2000 listeners (was 200).
max_users = 2000
# List this receiver on sdr-list.xyz, the public directory of web receivers.
# It needs the grid square above and the address listeners use; the report
# goes out once a minute, and the receiver drops out of the directory five
# minutes after the last one. The admin panel's Station page does the same.
# sdr_list    = yes
# public_host = sdr.example.org
# public_port = 8073
# Listeners from one IPv4 address, or one IPv6 /64, so one machine cannot take
# every place. 0 for no limit. Behind a proxy this counts the addresses the
# proxy reports, so the proxy must be listed in trusted_proxies.
# fernbench: per-address limits off (was 16).
max_users_per_address = 0
# Whether listeners may chat. With no, messages are refused with that reason,
# nothing said is kept, and a chat widget says the chat is off.
chat = yes

[server]
# 0.0.0.0 listens on IPv4 only.  Use :: for both families on one socket, which
# is the default shape on a machine with an IPv6 address; the server falls back
# to IPv4 by itself on a kernel without IPv6.
bind = 0.0.0.0
port = 8073
# Where the built client lives. Run `npm ci && npm run build` in web first.
# fernbench: the installed pages, as install.sh writes it (was ../web/dist).
root = /opt/fernsdr/current/web
log_level = info
# Connections silent for this long are dropped.
idle_timeout = 120
# Shared audio workers. Unset uses spare CPUs, up to 8; 0 disables the pool.
# Small listener groups stay on the band thread. In CPU-limited containers,
# set this explicitly because CPU affinity does not reveal every quota.
# dsp_workers = 2
# Allow room for HTTP requests as well as the site's listener limit.
# fernbench: room for 2000 listeners in the example's proportion of two
# connections per place (was 400).
max_connections = 4000
# fernbench: per-address limits off; the default is 32 connections from one
# address (src/main.cpp), and 0 switches the check off (src/net/server.cpp).
max_connections_per_address = 0
# Whose X-Forwarded-For / X-Real-IP headers to believe.  Anyone can send those
# headers, so they are believed only from the addresses listed here - without
# this, a listener behind no proxy at all could write any address they liked
# into your log.  "loopback" covers the nginx or Caddy on the same machine
# that DEPLOYMENT.md recommends for HTTPS.  Use "none" if there is no proxy,
# or a list like "10.0.0.0/8, 192.168.1.5" for one on another host.
trusted_proxies = loopback
# Which sites may show the receiver's page in a frame: self, none, or origins
# such as https://club.example.org, for embedding it in a club's own website.
# The admin page is never framed.
frame_ancestors = self


# ---------------------------------------------------------------------------
# Bands
#
# Each [band:<id>] is one slice of spectrum with its own IQ source and its own
# DSP thread. The heavy transforms are shared. Each listener still needs its
# own demodulator, codec and network traffic; large groups share audio workers.
#
# source = test    a synthetic band, for trying the server out with no hardware
#        = file    read IQ from a file, FIFO, or '-' for standard input
#        = udp     receive IQ datagrams, e.g. from ka9q-radio
#        = module  a hardware module installed from the admin panel, such as
#                  the RTL-SDR one; see the example below and docs/MODULES.md
#
# signal = iq      complex samples, centred on `center`  (the default)
#        = real    real samples, covering 0 .. sample_rate/2.  This is how an
#                  RX-888 mk2 direct-samples the whole of HF: at 64 Msps it
#                  covers 0-32 MHz in one band.  `center` is ignored; use
#                  `frequency_offset` if the front end shifts the range.
#
# format = cs8 | cu8 | cs16 | cf32   (interleaved I/Q, for signal = iq)
#        = s8 | u8 | s16 | f32       (one value per sample, for signal = real)
#
# noise_blanker    0 to 1, default 0.  Runs on the wideband signal before any
#                  channel filtering, which is the only place an impulse still
#                  looks like an impulse - measured at +10 dB on an impulsive
#                  channel, and at no cost on a clean one.  Shared by everyone
#                  listening to the band, so it is the operator's call, not a
#                  per-listener control.
#
# Corrections for the front end's own flaws, made before the blanker, the
# waterfall and every listener see the band. All three can also be switched
# from the band's page in the admin panel while the band runs.
#
# dc_remove        yes | no, default no.  Takes out the DC offset of a zero-IF
#                  receiver, the spike in the middle of an RTL-SDR's waterfall.
# iq_balance       yes | no, default no.  Measures the gain and phase error
#                  between I and Q from the band itself and corrects it, which
#                  takes out the mirror image a strong signal leaves on the
#                  other side of the centre.  IQ inputs only.
# iq_swap          yes | no, default no.  For an input that delivers the
#                  spectrum mirrored: signals move the wrong way when tuned.
#
# ppm              the receiver's crystal error in parts per million.  One
#                  crystal usually clocks both the tuner and the converter, so
#                  an error stretches every frequency on the band; this scales
#                  them back.  The band's page in the admin panel measures it
#                  against a station whose frequency is known.  A tuner that
#                  lands a fixed distance beside its frequency is corrected
#                  with frequency_offset instead.
# ---------------------------------------------------------------------------

# fernbench: the lab's input in place of the synthetic band: the FIFO the
# harness mounts at /iq/in, as in the example's "A named pipe" below and
# DEPLOYMENT.md, "Several bands from one radio". A FIFO is read as it
# arrives, unpaced, and a writer that goes away is waited for, not an end.
# Was: [band:demo], name Demo (synthetic), source test, sample_rate 192k,
# center 7.1M. The band's other settings are the example's.
[band:40m]
name        = 40 m
source      = file
path        = /iq/in
format      = cu8
sample_rate = 2048k
center      = 7.1M
# Widest passband one listener may request.
max_bandwidth = 12k
# Hard ceiling on one listener's combined audio + waterfall stream.  The
# server reduces the waterfall first, then audio bitrate if congestion lasts.
max_user_bitrate = 100000
# The audio bitrate a listener starts on for this band.  Listeners can change
# it; this is what they get before they do.
#
# Measured against real recordings of a crowded 20 m band, 48000 keeps 87.5%
# of FT8 decodes through the codec and 64000 keeps 95.2%.  A band pointed at a
# digital segment is worth the extra third; one carrying broadcast voice is
# not.  See docs/PERFORMANCE.md.
# audio_bitrate = 48000


# A channelized 1536 kHz complex stream on standard input. Configure its
# producer separately. Raw RX888 samples are real; see docs/DEPLOYMENT.md
# for the 0-30 MHz configuration and the hardware producer command.
#
# [band:40m]
# name        = 40 m
# source      = stdin
# format      = cs16
# sample_rate = 1536k
# center      = 7.1M
# max_bandwidth = 12k

# An RTL-SDR dongle through the RTL-SDR module, installed from the admin
# panel under Modules. The band says which dongle and how to set it up; the
# module is started, watched and restarted by the receiver, so an unplugged
# dongle takes this band offline and it comes back when the dongle does.
# "Find devices" in the panel lists the serials. On a systemd service, run
# install.sh with --usb once so the receiver may open USB devices.
#
# [band:20m]
# name            = 20 m
# source          = module
# module          = rtlsdr
# sample_rate     = 2400k
# center          = 14.175M
# module.device   = serial:00000001
# module.gain     = auto
# module.bias_tee = no

# Where modules are kept and where the admin panel may install them from.
# Only this file can change this section; the panel never does.
#
# [modules]
# directory = fernsdr-modules
# catalog   = Steven9101/Fern-RTLSDR

# An RTL dongle through rtl_sdr instead, when a pipe is all you want:
#
#   rtl_sdr -f 7100000 -s 2048000 - | fernsdr config.ini
#
# [band:40m]
# source      = stdin
# format      = cu8
# sample_rate = 2048k
# center      = 7.1M

# A named pipe, so the front end and the server can be restarted separately:
#
# [band:20m]
# source      = file
# path        = /tmp/iq-20m
# format      = cs16
# sample_rate = 1536k
# center      = 14.15M

# ka9q-radio over multicast:
#
# [band:80m]
# source      = udp
# bind        = 10.0.0.5
# multicast   = 239.1.2.3
# port        = 5004
# rtp         = true
# format      = cs16
# sample_rate = 1536k
# center      = 3.7M

# Optional per-band tuning; the defaults are derived from the sample rate and
# are usually right.
#
# fft_size            channelizer transform size (power of two).  Default aims
#                     for ~50 Hz bins, which also puts the block near 10 ms.
# spectrum_bins       waterfall transform size.  Default is twice fft_size.
# spectrum_rate       spectrum lines per second produced.  Default 25.
# spectrum_averages   transforms averaged per line.  Default 8.
# spectrum_smoothing  0 to 0.95.  Default 0.5.  Steadies the display and cuts
#                     the waterfall bitrate, because the variance it removes
#                     is noise the codec would otherwise have to encode.
# usable_fraction     fraction of the sample rate shown.  Default 0.8 for IQ
#                     and 0.94 for real input: the outer edges are past the
#                     anti-alias filter and are not real spectrum.
# frequency_offset    added to every frequency in the band, for a front end
#                     with a converter or a direct-sampling range that does
#                     not start at zero.

# A real-sampling wideband front end - the whole of HF in one band:
#
#   rx888_stream -s 64000000 | fernsdr fernsdr.conf
#
# [band:hf]
# name             = HF 0-32 MHz
# source           = file
# path             = -
# signal           = real
# format           = s16
# sample_rate      = 64M
# noise_blanker    = 0.5
# max_bandwidth    = 12k
# max_user_bitrate = 100000
#
# That costs about 1.9 cores for the transform, shared by everyone on the
# band, plus roughly 0.23% of a core per listener.  See docs/PERFORMANCE.md.
